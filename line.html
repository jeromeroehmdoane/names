<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Name Popularity</title>

  <script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    html, body { height: 100%; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background:#fff;
      color:#111;
    }
    .wrap{
      height:100%;
      max-width:980px;
      margin:0 auto;
      padding:0;
    }
    .card{
      height:100%;
      background:#fff;
      border:1px solid #e6e6e6;
      border-radius:14px;
      padding:12px;
      box-shadow:0 1px 2px rgba(0,0,0,0.04);
      box-sizing:border-box;
      display:flex;
      flex-direction:column;
      gap:6px;
    }

    .cardTitle{
      margin:0;
      font-size:16px;
      font-weight:650;
      line-height:1.2;
    }

    .controlsRow{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:10px;
      flex-wrap:nowrap;
      margin-top:2px;
    }
    .ctrl{
      display:flex;
      flex-direction:column;
      min-width:140px;
      max-width:48%;
    }
    .ctrlLabel{
      font-size:12px;
      color:#6b7280;
      margin:0 0 4px;
      white-space:nowrap;
    }
    select{
      font-size:14px;
      padding:8px 10px;
      border-radius:10px;
      border:1px solid #e6e6e6;
      background:#fff;
      color:#111;
      width:100%;
    }
    @media (max-width: 420px){
      .controlsRow{ flex-direction:column; align-items:stretch; }
      .ctrl{ max-width:100%; min-width:0; }
    }

    .status{
      margin:0;
      font-size:13px;
      color:#555;
      min-height:16px;
    }

    #plot{
      width:100%;
      flex:1 1 auto;
      min-height:240px;
    }

    @media (orientation: landscape) and (max-height: 520px){
      .card{ padding:10px; gap:4px; }
      .cardTitle{ font-size:15px; }
      .status{ min-height:14px; font-size:12px; }
      #plot{ min-height:160px; max-height:62vh; }
      select{ padding:7px 9px; font-size:13px; }
    }

    .hidden{ display:none; }
  </style>
</head>

<body>
<div class="wrap">
  <div class="card">
    <h2 class="cardTitle" id="cardTitle">Popularity of Name</h2>

    <div class="controlsRow">
      <div class="ctrl" style="align-items:flex-start;">
        <div class="ctrlLabel">Y-Axis</div>
        <select id="metricSelect">
          <option value="frequency">frequency</option>
          <option value="percentage">percentage</option>
          <option value="rank">rank</option>
        </select>
      </div>

      <div class="ctrl" style="align-items:flex-end;">
        <div class="ctrlLabel">Sex</div>
        <select id="sexSelect">
          <option value="combined">combined</option>
          <option value="separate">separate</option>
          <option value="male">male</option>
          <option value="female">female</option>
        </select>
      </div>
    </div>

    <div class="hidden">
      <input id="nameInput" />
      <button id="goBtn">Show</button>
    </div>

    <div class="status" id="status"></div>
    <div id="plot"></div>
  </div>
</div>

<script>
const BASE = "https://raw.githubusercontent.com/jeromeroehmdoane/names/refs/heads/main/";
const GROUPS = ["ABCD","EFGH","IJKL","MNOP","QRST","UVWXYZ"];

let GD = null;
let SERIES = null;

function groupForName(name){
  return GROUPS.find(g => g.includes(name[0].toUpperCase()));
}

function setTitle(name){
  document.getElementById("cardTitle").textContent =
    name ? `Popularity of ${name}` : "Popularity of Name";
}

function clearPlot(){
  try{
    Plotly.purge("plot");
  }catch(e){}
  GD = null;
  SERIES = null;
}

function loadPlot(name){
  name = (name || "").trim();
  if(!name) return;

  setTitle(name);
  document.getElementById("status").textContent = "Loading…";

  const g = groupForName(name);

  Papa.parse(`${BASE}small_data_${g}.csv`, {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: res => renderPlot(name, res.data)
  });
}

function renderPlot(name, rows){
  const filtered = rows
    .filter(r => (r.name || "").toLowerCase() === name.toLowerCase())
    .map(r => ({
      year: +r.year,
      sex: (r.sex || "").trim(),
      frequency: +r.frequency,
      percentage: +r.percentage,
      overall_percentage: +r.overall_percentage,
      overall_rank: +r.overall_rank,
      rank: +r.rank
    }))
    .filter(r => Number.isFinite(r.year));

  if(filtered.length === 0){
    clearPlot();
    document.getElementById("status").textContent =
      `No data for "${name}" found. Names with fewer than 5 occurrences in a year are not included in the dataset.`;
    return;
  }

  document.getElementById("status").textContent = "";

  const m = filtered.filter(r => r.sex === "M").sort((a,b)=>a.year-b.year);
  const f = filtered.filter(r => r.sex === "F").sort((a,b)=>a.year-b.year);

  const combinedMap = {};
  function upsert(arr){
    arr.forEach(r => {
      if(!combinedMap[r.year]){
        combinedMap[r.year] = {
          year: r.year,
          frequency: 0,
          overall_percentage: r.overall_percentage,
          overall_rank: r.overall_rank
        };
      }
      combinedMap[r.year].frequency += r.frequency || 0;
    });
  }
  upsert(m); upsert(f);
  const c = Object.values(combinedMap).sort((a,b)=>a.year-b.year);

  const hover = {
    combined:{
      frequency:"Year: %{x}<br>Frequency: %{y:,.0f}<extra></extra>",
      percentage:"Year: %{x}<br>Percentage: %{y:.2f}%<extra></extra>",
      rank:"Year: %{x}<br>Rank: %{y:,.0f}<extra></extra>"
    },
    sexSpecific:{
      frequency:"Year: %{x}<br>%{fullData.name} Frequency: %{y:,.0f}<extra></extra>",
      percentage:"Year: %{x}<br>%{fullData.name} Percentage: %{y:.2f}%<extra></extra>",
      rank:"Year: %{x}<br>%{fullData.name} Rank: %{y:,.0f}<extra></extra>"
    }
  };

  const yaxisByMetric = {
    frequency:{title:{text:"Frequency",standoff:14},tickformat:",.0f"},
    percentage:{title:{text:"Percentage",standoff:14},tickformat:".2f",ticksuffix:"%",rangemode:"tozero"},
    rank:{title:{text:"Rank (log scale)",standoff:14},type:"log",autorange:"reversed"}
  };

  SERIES = { c, m, f, hover, yaxisByMetric };
  rebuildPlotFromState();
}

function yFor(arr, metric, mode){
  if(metric === "frequency") return arr.map(d=>d.frequency);
  if(metric === "percentage"){
    return mode==="combined"
      ? arr.map(d=>d.overall_percentage)
      : arr.map(d=>d.percentage);
  }
  return mode==="combined"
    ? arr.map(d=>d.overall_rank)
    : arr.map(d=>d.rank);
}

function visibilityForSex(mode){
  if(mode==="separate") return [false,true,true];
  if(mode==="male") return [false,true,false];
  if(mode==="female") return [false,false,true];
  return [true,false,false];
}

function shapesForMetric(metric, minRank){
  if(metric!=="rank" || !Number.isFinite(minRank) || minRank>5) return [];
  return [{
    type:"line",
    xref:"paper",x0:0,x1:1,
    yref:"y",y0:1,y1:1,
    line:{color:"rgba(0,0,0,0.18)",width:1}
  }];
}

function clampRankAxisNotBelow1(gd){
  const y = gd?.layout?.yaxis;
  if(y?.type==="log" && Array.isArray(y.range) && y.range[1]<0){
    Plotly.relayout(gd, {"yaxis.range[1]":0});
  }
}

function rebuildPlotFromState(){
  const metric = metricSelect.value;
  const sexMode = sexSelect.value;
  const {c,m,f,hover,yaxisByMetric} = SERIES;

  const vis = visibilityForSex(sexMode);

  let minRank = NaN;
  if(metric==="rank"){
    minRank = Math.min(
      ...(vis[0]?yFor(c,"rank","combined"):[]),
      ...(vis[1]?yFor(m,"rank","male"):[]),
      ...(vis[2]?yFor(f,"rank","female"):[])
    );
  }

  Plotly.newPlot("plot",[
    {x:c.map(d=>d.year),y:yFor(c,metric,"combined"),mode:"lines",name:"Combined",line:{color:"purple"},visible:vis[0],hovertemplate:hover.combined[metric]},
    {x:m.map(d=>d.year),y:yFor(m,metric,"male"),mode:"lines",name:"Male",line:{color:"blue"},visible:vis[1],hovertemplate:hover.sexSpecific[metric]},
    {x:f.map(d=>d.year),y:yFor(f,metric,"female"),mode:"lines",name:"Female",line:{color:"red"},visible:vis[2],hovertemplate:hover.sexSpecific[metric]}
  ],{
    xaxis:{title:"Year",fixedrange:true},
    yaxis:{...yaxisByMetric[metric],fixedrange:true},
    hovermode:"closest",
    margin:{l:60,r:12,t:10,b:38},
    showlegend:false,
    dragmode:false,
    shapes:shapesForMetric(metric,minRank)
  },{
    responsive:true,
    displayModeBar:false
  }).then(gd=>{
    GD=gd;
    if(metric==="rank") clampRankAxisNotBelow1(gd);
  });
}

metricSelect.onchange = sexSelect.onchange = rebuildPlotFromState;

window.addEventListener("message",e=>{
  if(e.data?.type==="SET_INPUTS_AND_RUN"){
    nameInput.value=e.data.name;
    loadPlot(e.data.name);
  }
});
</script>
</body>
</html>
