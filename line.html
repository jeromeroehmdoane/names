<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Name Popularity</title>

  <script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    html, body { height: 100%; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background:#fff;
      color:#111;
    }
    .wrap{
      height:100%;
      max-width:980px;
      margin:0 auto;
      padding:0;
    }
    .card{
      height:100%;
      background:#fff;
      border:1px solid #e6e6e6;
      border-radius:14px;
      padding:12px;
      box-shadow:0 1px 2px rgba(0,0,0,0.04);
      box-sizing:border-box;
      display:flex;
      flex-direction:column;
      gap:6px;
    }

    .cardTitle{
      margin:0;
      font-size:16px;
      font-weight:650;
      line-height:1.2;
    }

    .controlsRow{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:10px;
      flex-wrap:nowrap;
      margin-top:2px;
    }
    .ctrl{
      display:flex;
      flex-direction:column;
      min-width:140px;
      max-width:48%;
    }
    .ctrlLabel{
      font-size:12px;
      color:#6b7280;
      margin:0 0 4px;
      white-space:nowrap;
    }
    select{
      font-size:14px;
      padding:8px 10px;
      border-radius:10px;
      border:1px solid #e6e6e6;
      background:#fff;
      color:#111;
      width:100%;
    }
    /* If screen is too narrow, stack to avoid overlap */
    @media (max-width: 420px){
      .controlsRow{ flex-direction:column; align-items:stretch; }
      .ctrl{ max-width:100%; min-width:0; }
    }

    .status{
      margin:0;
      font-size:13px;
      color:#555;
      min-height:16px;
    }

    #plot{
      width:100%;
      flex:1 1 auto;
      min-height:240px;
    }

    /* Mobile landscape: force plot to fit in view */
    @media (orientation: landscape) and (max-height: 520px){
      .card{ padding:10px; gap:4px; }
      .cardTitle{ font-size:15px; }
      .status{ min-height:14px; font-size:12px; }
      #plot{ min-height:160px; max-height:62vh; }
      select{ padding:7px 9px; font-size:13px; }
    }

    .hidden{ display:none; }
  </style>
</head>

<body>
<div class="wrap">
  <div class="card">
    <h2 class="cardTitle" id="cardTitle">Popularity of Name</h2>

    <!-- Dropdowns ABOVE the plot: Y-axis left, Sex right -->
    <div class="controlsRow">
      <div class="ctrl" style="align-items:flex-start;">
        <div class="ctrlLabel">Y-Axis</div>
        <select id="metricSelect">
          <option value="frequency">frequency</option>
          <option value="percentage">percentage</option>
          <option value="rank">rank</option>
        </select>
      </div>

      <div class="ctrl" style="align-items:flex-end;">
        <div class="ctrlLabel">Sex</div>
        <select id="sexSelect">
          <option value="combined">combined</option>
          <option value="separate">separate</option>
          <option value="male">male</option>
          <option value="female">female</option>
        </select>
      </div>
    </div>

    <!-- hidden local controls; IDs preserved for bridge -->
    <div class="hidden">
      <input id="nameInput" />
      <button id="goBtn">Show</button>
    </div>

    <div class="status" id="status"></div>
    <div id="plot"></div>
  </div>
</div>

<script>
const BASE = "https://raw.githubusercontent.com/jeromeroehmdoane/names/refs/heads/main/";
const GROUPS = ["ABCD","EFGH","IJKL","MNOP","QRST","UVWXYZ"];

let GD = null;
let SERIES = null;

function groupForName(name){
  return GROUPS.find(g => g.includes(name[0].toUpperCase()));
}

function setTitle(name){
  document.getElementById("cardTitle").textContent = name ? `Popularity of ${name}` : "Popularity of Name";
}

function loadPlot(name){
  name = (name || "").trim();
  if(!name) return;

  setTitle(name);

  const g = groupForName(name);
  document.getElementById("status").textContent = "Loading…";

  Papa.parse(`${BASE}small_data_${g}.csv`, {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: res => {
      renderPlot(name, res.data);
      document.getElementById("status").textContent = "";
    }
  });
}

function renderPlot(name, rows){
  // Data model per your clarification:
  // - No "C" rows.
  // - percentage is sex-specific (M or F).
  // - overall_percentage is the combined percentage (same value on M/F rows).
  // - overall_rank is the combined rank (same value on M/F rows).
  const filtered = rows
    .filter(r => (r.name || "").toLowerCase() === name.toLowerCase())
    .map(r => ({
      year: +r.year,
      sex: (r.sex || "").trim(),
      frequency: +r.frequency,
      percentage: +r.percentage,
      overall_percentage: +r.overall_percentage,
      overall_rank: +r.overall_rank,
      rank: +r.rank
    }))
    .filter(r => Number.isFinite(r.year));

  const m = filtered.filter(r => r.sex === "M").sort((a,b)=>a.year-b.year);
  const f = filtered.filter(r => r.sex === "F").sort((a,b)=>a.year-b.year);

  // Build combined series:
  // - frequency: M + F (by year)
  // - overall_percentage: take from either sex row (they match)
  // - overall_rank: take from either sex row (they match)
  const combinedMap = {};
  function upsert(arr){
    arr.forEach(r => {
      if(!combinedMap[r.year]){
        combinedMap[r.year] = {
          year: r.year,
          frequency: 0,
          overall_percentage: r.overall_percentage,
          overall_rank: r.overall_rank
        };
      }
      combinedMap[r.year].frequency += (Number.isFinite(r.frequency) ? r.frequency : 0);
      // Keep overall_* (same on both rows); but if missing on first, allow overwrite with numeric
      if (Number.isFinite(r.overall_percentage)) combinedMap[r.year].overall_percentage = r.overall_percentage;
      if (Number.isFinite(r.overall_rank)) combinedMap[r.year].overall_rank = r.overall_rank;
    });
  }
  upsert(m); upsert(f);
  const c = Object.values(combinedMap).sort((a,b)=>a.year-b.year);

  // Hover templates:
  // - Always include Year
  // - In separate mode, include year + line with Rank/Frequency/Percentage
  const hover = {
  combined: {
    frequency: "Year: %{x}<br>Frequency: %{y:,.0f}<extra></extra>",
    percentage: "Year: %{x}<br>Percentage: %{y:.2f}%<extra></extra>",
    rank: "Year: %{x}<br>Rank: %{y:,.0f}<extra></extra>"
  },
  sexSpecific: {
    frequency: "Year: %{x}<br>%{fullData.name} Frequency: %{y:,.0f}<extra></extra>",
    percentage: "Year: %{x}<br>%{fullData.name} Percentage: %{y:.2f}%<extra></extra>",
    rank: "Year: %{x}<br>%{fullData.name} Rank: %{y:,.0f}<extra></extra>"
  }
};

  const yaxisByMetric = {
    frequency:{title:{text:"Frequency",standoff:14},tickformat:",.0f"},
    percentage:{title:{text:"Percentage",standoff:14},tickformat:".2f",ticksuffix:"%"},
    rank:{title:{text:"Rank (log scale)",standoff:14},type:"log",autorange:"reversed"}
  };

  SERIES = { c, m, f, hover, yaxisByMetric };

  // Initialize plot from dropdown state
  rebuildPlotFromState();
}

function yFor(arr, metric, mode){
  // mode in {"combined","male","female","separate"}
  if(metric === "frequency"){
    return arr.map(d => d.frequency);
  }
  if(metric === "percentage"){
    // combined uses overall_percentage; sex-specific uses percentage
    if(mode === "combined") return arr.map(d => d.overall_percentage);
    return arr.map(d => d.percentage);
  }
  // rank metric:
  // combined uses overall_rank; sex-specific uses rank
  if(mode === "combined") return arr.map(d => d.overall_rank);
  return arr.map(d => d.rank);
}

function visibilityForSex(mode){
  if(mode === "separate") return [false,true,true];
  if(mode === "male") return [false,true,false];
  if(mode === "female") return [false,false,true];
  return [true,false,false]; // combined
}

function rebuildPlotFromState(){
  if(!SERIES) return;

  const metric = document.getElementById("metricSelect").value || "frequency";
  const sexMode = document.getElementById("sexSelect").value || "combined";

  const { c, m, f, hover, yaxisByMetric } = SERIES;

  const traces = [
    {
      x: c.map(d=>d.year),
      y: yFor(c, metric, "combined"),
      mode:"lines",
      name:"Combined",
      line:{color:"purple"},
      hovertemplate: hover.combined[metric]
    },
    {
      x: m.map(d=>d.year),
      y: yFor(m, metric, "male"),
      mode:"lines",
      name:"Male",
      line:{color:"blue"},
      visible:false,
      hovertemplate: hover.combined[metric] // overwritten for separate
    },
    {
      x: f.map(d=>d.year),
      y: yFor(f, metric, "female"),
      mode:"lines",
      name:"Female",
      line:{color:"red"},
      visible:false,
      hovertemplate: hover.combined[metric] // overwritten for separate
    }
  ];

  const vis = visibilityForSex(sexMode);
  traces[0].visible = vis[0];
  traces[1].visible = vis[1];
  traces[2].visible = vis[2];

  // Hover behavior:
  // - For separate: include year + sex label (Male/Female via fullData.name)
  // - For male/female: treat like combined-style hover (year included)
  if(sexMode === "separate"){
    traces[0].hovertemplate = null;
    traces[1].hovertemplate = hover.sexSpecific[metric];
    traces[2].hovertemplate = hover.sexSpecific[metric];
  } else {
    traces[0].hovertemplate = hover.combined[metric];
    traces[1].hovertemplate = hover.combined[metric];
    traces[2].hovertemplate = hover.combined[metric];
  }

  const isLandscapeShort = (window.matchMedia && window.matchMedia("(orientation: landscape) and (max-height: 520px)").matches);

  const layout = {
    // No Plotly title; title is in the card header
    xaxis: { title: "Year", fixedrange: true },
    yaxis: Object.assign({}, yaxisByMetric[metric], { fixedrange: true }),
    hovermode: "closest",
    margin: { l: 60, r: 12, t: 10, b: isLandscapeShort ? 30 : 38 },
    showlegend: false,
    dragmode: false
  };

  // Completely disable motion while keeping hover:
  // - fixedrange on axes
  // - dragmode false
  // - scrollZoom false
  // - doubleClick false
  // - displayModeBar false
  const config = {
    responsive: true,
    displayModeBar: false,
    scrollZoom: false,
    doubleClick: false
  };

  Plotly.newPlot("plot", traces, layout, config).then(gd => {
    GD = gd;

    // Extra safety: prevent touch/drag from initiating plot interactions.
    // Hover still works; vertical swipes scroll the page.
    try {
      gd.on("plotly_relayouting", () => false);
    } catch(e) {}
  });
}

function applyDropdowns(){
  if(!GD || !SERIES){
    // If plot isn't built yet, ignore
    return;
  }

  const metric = document.getElementById("metricSelect").value || "frequency";
  const sexMode = document.getElementById("sexSelect").value || "combined";

  const { c, m, f, hover, yaxisByMetric } = SERIES;

  const newY = [
    yFor(c, metric, "combined"),
    yFor(m, metric, "male"),
    yFor(f, metric, "female")
  ];

  const vis = visibilityForSex(sexMode);

  const newHover = (sexMode === "separate")
    ? [null, hover.sexSpecific[metric], hover.sexSpecific[metric]]
    : [hover.combined[metric], hover.combined[metric], hover.combined[metric]];

  const isLandscapeShort = (window.matchMedia && window.matchMedia("(orientation: landscape) and (max-height: 520px)").matches);

  Plotly.update(GD, {
    y: newY,
    visible: vis,
    hovertemplate: newHover
  }, {
    xaxis: Object.assign({}, (GD.layout.xaxis || {}), { fixedrange: true }),
    yaxis: Object.assign({}, yaxisByMetric[metric], { fixedrange: true }),
    dragmode: false,
    margin: Object.assign({}, (GD.layout.margin || {}), { b: isLandscapeShort ? 30 : 38 })
  });
}

document.getElementById("metricSelect").addEventListener("change", applyDropdowns);
document.getElementById("sexSelect").addEventListener("change", applyDropdowns);

// Hidden legacy controls (kept for bridge)
document.getElementById("goBtn").onclick = () => loadPlot(document.getElementById("nameInput").value);
document.getElementById("nameInput").addEventListener("keydown", e => { if(e.key === "Enter") loadPlot(e.target.value); });

// Receive inputs from parent index.html
window.addEventListener("message", (event) => {
  const d = event.data || {};
  if (d.type !== "SET_INPUTS_AND_RUN") return;

  if (typeof d.name === "string") {
    document.getElementById("nameInput").value = d.name;
    loadPlot(d.name);
  }
});

// Optional: when orientation changes, keep plot fitting nicely
window.addEventListener("orientationchange", () => {
  try { setTimeout(() => { if(SERIES) rebuildPlotFromState(); }, 200); } catch(e) {}
});
</script>

</body>
</html>
