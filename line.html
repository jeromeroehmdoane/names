<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Name Popularity</title>

  <script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: #fff;
      color: #111;
    }
    .wrap {
      height: 100%;
      max-width: 980px;
      margin: 0 auto;
      padding: 0;
    }
    .card {
      height: 100%;
      background: #fff;
      border: 1px solid #e6e6e6;
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .cardTitle {
      margin: 0;
      font-size: 16px;
      font-weight: 650;
      line-height: 1.2;
    }

    .controlsRow {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: nowrap;
      margin-top: 2px;
    }
    .ctrlLabel {
      font-size: 12px;
      color: #6b7280;
      margin: 0 0 4px;
    }
    .ctrl {
      display: flex;
      flex-direction: column;
      min-width: 140px;
      flex: 0 1 auto;
    }
    .ctrl select {
      font-size: 14px;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid #e6e6e6;
      background: #fff;
      color: #111;
      width: 100%;
    }

    /* Stack dropdowns if screen is too narrow to avoid overlap */
    @media (max-width: 420px){
      .controlsRow{
        flex-direction: column;
        align-items: stretch;
      }
      .ctrl{
        min-width: 0;
      }
    }

    .status {
      margin: 0;
      font-size: 13px;
      color: #555;
      min-height: 16px;
    }

    #plot {
      width: 100%;
      flex: 1 1 auto;
      min-height: 240px;
    }

    /* Try to fit well in phone landscape */
    @media (orientation: landscape) and (max-height: 520px){
      .card { padding: 10px; gap: 4px; }
      .cardTitle { font-size: 15px; }
      .status { min-height: 14px; font-size: 12px; }
      #plot { min-height: 180px; }
    }

    /* hidden local controls; IDs preserved */
    .hidden { display:none; }
  </style>
</head>

<body>
<div class="wrap">
  <div class="card">
    <h2 class="cardTitle" id="cardTitle">Popularity of Name</h2>

    <!-- Dropdowns ABOVE the plot: Y-axis left, Sex right -->
    <div class="controlsRow">
      <div class="ctrl" style="align-items:flex-start;">
        <div class="ctrlLabel">Y-Axis</div>
        <select id="metricSelect">
          <option value="frequency">frequency</option>
          <option value="percentage">percentage</option>
          <option value="rank">rank</option>
        </select>
      </div>

      <div class="ctrl" style="align-items:flex-end;">
        <div class="ctrlLabel">Sex</div>
        <select id="sexSelect">
          <option value="combined">combined</option>
          <option value="separate">separate</option>
          <option value="male">male</option>
          <option value="female">female</option>
        </select>
      </div>
    </div>

    <!-- hidden local controls; IDs preserved for bridge -->
    <div class="hidden">
      <input id="nameInput" />
      <button id="goBtn">Show</button>
    </div>

    <div class="status" id="status"></div>
    <div id="plot"></div>
  </div>
</div>

<script>
const BASE = "https://raw.githubusercontent.com/jeromeroehmdoane/names/refs/heads/main/";
const GROUPS = ["ABCD","EFGH","IJKL","MNOP","QRST","UVWXYZ"];

let GD = null; // plotly graph div ref
let SERIES = null; // store computed series for re-render without changing calculations

function groupForName(name) {
  return GROUPS.find(g => g.includes(name[0].toUpperCase()));
}

function setTitle(name){
  const t = document.getElementById("cardTitle");
  t.textContent = name ? `Popularity of ${name}` : "Popularity of Name";
}

function loadPlot(name) {
  name = name.trim();
  if (!name) return;

  setTitle(name);

  const g = groupForName(name);
  document.getElementById("status").textContent = "Loading…";

  Papa.parse(`${BASE}small_data_${g}.csv`, {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: res => {
      renderPlot(name, res.data);
      document.getElementById("status").textContent = "";
    }
  });
}

function renderPlot(name, rows) {
  // --- KEEP EXISTING CALCULATIONS/LOGIC INTACT ---
  const data = rows
    .filter(r => (r.name || "").toLowerCase() === name.toLowerCase())
    .map(r => ({
      year: +r.year,
      sex: (r.sex || "").trim(),
      frequency: +r.frequency,
      percentage: +r.percentage,
      rank: +r.rank
    }))
    .filter(r => Number.isFinite(r.year) && r.rank >= 1);

  const m = data.filter(r => r.sex === "M").sort((a,b)=>a.year-b.year);
  const f = data.filter(r => r.sex === "F").sort((a,b)=>a.year-b.year);

  const combinedMap = {};
  data.forEach(r => {
    if (!combinedMap[r.year]) combinedMap[r.year] = { year:r.year, frequency:0, percentage:0, rank:r.rank };
    combinedMap[r.year].frequency += r.frequency;
    combinedMap[r.year].percentage += r.percentage;
    combinedMap[r.year].rank = Math.min(combinedMap[r.year].rank, r.rank);
  });
  const c = Object.values(combinedMap).sort((a,b)=>a.year-b.year);

  const hoverNonSep = {
    frequency: "%{x}<br>Frequency: %{y:,.0f}<extra></extra>",
    percentage: "%{x}<br>Percentage: %{y:.2f}%<extra></extra>",
    rank: "%{x}<br>Rank: %{y:,.0f}<extra></extra>"
  };
  const hoverSep = {
    frequency: "Frequency: %{y:,.0f}<extra></extra>",
    percentage: "Percentage: %{y:.2f}%<extra></extra>",
    rank: "Rank: %{y:,.0f}<extra></extra>"
  };

  const yaxisByMetric = {
    frequency:{title:{text:"Frequency",standoff:14},tickformat:",.0f"},
    percentage:{title:{text:"Percentage",standoff:14},tickformat:".2f",ticksuffix:"%"},
    rank:{title:{text:"Rank (log scale)",standoff:14},type:"log",autorange:"reversed"}
  };

  // Store for dropdown updates (no re-fetch, no recalcs beyond what already exists)
  SERIES = { c, m, f, hoverNonSep, hoverSep, yaxisByMetric };

  // Initial dropdown state
  const metric = document.getElementById("metricSelect").value || "frequency";
  const sexMode = document.getElementById("sexSelect").value || "combined";

  // Build initial traces based on metric
  function yForMetric(arr, metric){
    if(metric === "percentage") return arr.map(d=>d.percentage);
    if(metric === "rank") return arr.map(d=>d.rank);
    return arr.map(d=>d.frequency);
  }
  function hoverForMetric(metric, sep){
    return sep ? hoverSep[metric] : hoverNonSep[metric];
  }

  const traces = [
    {x:c.map(d=>d.year), y:yForMetric(c, metric), mode:"lines", name:"Combined", line:{color:"purple"}, hovertemplate:hoverForMetric(metric,false)},
    {x:m.map(d=>d.year), y:yForMetric(m, metric), mode:"lines", name:"Male", line:{color:"blue"}, visible:false, hovertemplate:hoverForMetric(metric,false)},
    {x:f.map(d=>d.year), y:yForMetric(f, metric), mode:"lines", name:"Female", line:{color:"red"}, visible:false, hovertemplate:hoverForMetric(metric,false)}
  ];

  // Apply sex visibility
  function visibilityForSex(mode){
    if(mode === "separate") return [false,true,true];
    if(mode === "male") return [false,true,false];
    if(mode === "female") return [false,false,true];
    return [true,false,false]; // combined
  }
  traces[0].visible = visibilityForSex(sexMode)[0];
  traces[1].visible = visibilityForSex(sexMode)[1];
  traces[2].visible = visibilityForSex(sexMode)[2];

  // If separate, use sex-specific hover templates for male/female
  if(sexMode === "separate"){
    traces[1].hovertemplate = hoverForMetric(metric,true);
    traces[2].hovertemplate = hoverForMetric(metric,true);
    traces[0].hovertemplate = null;
  }

  // LAYOUT: no Plotly title (we use the card header title)
  const isLandscapeShort = (window.matchMedia && window.matchMedia("(orientation: landscape) and (max-height: 520px)").matches);

  const layout = {
    xaxis: { title: "Year", fixedrange: true },
    yaxis: Object.assign({}, yaxisByMetric[metric], { fixedrange: true }),
    hovermode: "closest",
    margin: { l: 60, r: 12, t: 10, b: isLandscapeShort ? 32 : 38 },
    showlegend: false,
    dragmode: false  // disable drag interactions
  };

  const config = {
    responsive: true,
    displayModeBar: false,
    scrollZoom: false,
    doubleClick: false
  };

  Plotly.newPlot("plot", traces, layout, config).then(gd => {
    GD = gd;

    // Hard-disable any panning/zooming interactions beyond fixedrange/dragmode.
    // This prevents "grabbing" the plot on touch and keeps scroll behavior.
    try {
      gd.removeAllListeners && gd.removeAllListeners("plotly_relayouting");
    } catch(e) {}

    // If separate mode, allow legend? Your original used showlegend=true in separate,
    // but we are keeping "Change nothing else" behavior by not adding a legend UI here.
  });
}

// Dropdown handlers (presentation only; existing data/logic stays same)
function applyDropdowns(){
  if(!GD || !SERIES) return;

  const metric = document.getElementById("metricSelect").value || "frequency";
  const sexMode = document.getElementById("sexSelect").value || "combined";

  const { c, m, f, hoverNonSep, hoverSep, yaxisByMetric } = SERIES;

  function yForMetric(arr, metric){
    if(metric === "percentage") return arr.map(d=>d.percentage);
    if(metric === "rank") return arr.map(d=>d.rank);
    return arr.map(d=>d.frequency);
  }
  function hoverForMetric(metric, sep){
    return sep ? hoverSep[metric] : hoverNonSep[metric];
  }
  function visibilityForSex(mode){
    if(mode === "separate") return [false,true,true];
    if(mode === "male") return [false,true,false];
    if(mode === "female") return [false,false,true];
    return [true,false,false];
  }
  const vis = visibilityForSex(sexMode);

  const newY = [
    yForMetric(c, metric),
    yForMetric(m, metric),
    yForMetric(f, metric)
  ];

  const newHover = (sexMode === "separate")
    ? [null, hoverForMetric(metric,true), hoverForMetric(metric,true)]
    : [hoverForMetric(metric,false), hoverForMetric(metric,false), hoverForMetric(metric,false)];

  Plotly.update(GD, {
    y: newY,
    visible: vis,
    hovertemplate: newHover
  }, {
    yaxis: Object.assign({}, yaxisByMetric[metric], { fixedrange: true }),
    xaxis: Object.assign({}, (GD.layout.xaxis || {}), { fixedrange: true }),
    dragmode: false
  });
}

document.getElementById("metricSelect").addEventListener("change", applyDropdowns);
document.getElementById("sexSelect").addEventListener("change", applyDropdowns);

// legacy hidden controls
document.getElementById("goBtn").onclick=()=>loadPlot(document.getElementById("nameInput").value);
document.getElementById("nameInput").addEventListener("keydown",e=>{if(e.key==="Enter")loadPlot(e.target.value);});

// Receive inputs from parent index.html
window.addEventListener("message", (event) => {
  const d = event.data || {};
  if (d.type !== "SET_INPUTS_AND_RUN") return;

  if (typeof d.name === "string") {
    document.getElementById("nameInput").value = d.name;
    loadPlot(d.name);
  }
});
</script>

</body>
</html>
