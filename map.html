<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Name Popularity by State</title>

  <script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    html, body { height: 100%; }
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      background:#fff;
      color:#111;
    }

    .wrap{
      height:100%;
      max-width:1100px;
      margin:0 auto;
      padding:14px;
      box-sizing:border-box;
    }

    .card{
      height:100%;
      background:#fff;
      border:1px solid #e6e6e6;
      border-radius:14px;
      padding:14px;
      box-shadow:0 1px 2px rgba(0,0,0,0.04);
      box-sizing:border-box;

      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .controlsBar{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
    }
    .ctrl{
      display:flex;
      flex-direction:column;
      gap:4px;
      min-width:140px;
    }
    .ctrlLabel{
      font-size:12px;
      color:#6b7280;
      white-space:nowrap;
      margin:0;
    }
    select, input{
      font-size:14px;
      padding:8px 10px;
      border-radius:10px;
      border:1px solid #e6e6e6;
      background:#fff;
      color:#111;
      width:100%;
      box-sizing:border-box;
    }
    .spacer{
      flex:1 1 auto;
      min-width:10px;
    }

    .status{
      font-size:13px;
      color:#555;
      min-height:18px;
    }

    #plot{
      width:100%;
      flex:1 1 auto;
      min-height:420px;

      touch-action: pan-y;
      -ms-touch-action: pan-y;
    }

    @media (max-width: 520px){
      #plot{ min-height:360px; }
    }

    /* Landscape small screens: prioritize map height and reduce dead space */
    @media (orientation: landscape) and (max-height: 520px){
      .wrap{ padding:8px; }
      .card{ padding:10px; gap:6px; }
      #plot{ min-height:240px; }
    }

    .hidden{ display:none; }
  </style>
</head>

<body>
<div class="wrap">
  <div class="card">

    <div class="controlsBar">
      <div class="ctrl" style="align-items:flex-start;">
        <div class="ctrlLabel">Sex</div>
        <select id="sexSelect">
          <option value="combined" selected>Combined</option>
          <option value="M">Male</option>
          <option value="F">Female</option>
        </select>
      </div>

      <div class="spacer"></div>

      <div class="ctrl" style="align-items:flex-end;">
        <div class="ctrlLabel">Color</div>
        <select id="metricSelect">
          <option value="frequency">Frequency</option>
          <option value="percentage" selected>Percentage</option>
          <option value="rank">Rank</option>
        </select>
      </div>
    </div>

    <input id="nameInput" class="hidden" />
    <button id="goBtn" class="hidden">Show</button>

    <div class="status" id="status"></div>
    <div id="plot"></div>
  </div>
</div>

<script>
const BASE = "https://raw.githubusercontent.com/jeromeroehmdoane/names/refs/heads/main/";
const STATUS = document.getElementById("status");

const ALL_STATES = [
  "AL","AK","AZ","AR","CA","CO","CT","DE","DC","FL","GA","HI","ID","IL","IN","IA","KS","KY","LA","ME",
  "MD","MA","MI","MN","MS","MO","MT","NE","NV","NH","NJ","NM","NY","NC","ND","OH","OK","OR","PA","RI",
  "SC","SD","TN","TX","UT","VT","VA","WA","WV","WI","WY"
];

const FEMALE_SHARE_METRIC = "female_share";

const FEMALE_SHARE_SCALE = [
  [0.00, "#295da6"],
  [0.15, "#60a5fa"],
  [0.40, "#bfdbfe"],
  [0.50, "#ebebeb"],
  [0.60, "#fbcfe8"],
  [0.85, "#f472b6"],
  [1.00, "#d13b6a"]
];

let cached = { letter: null, rows: null };

function setStatus(msg){ STATUS.textContent = msg || ""; }
function safeLower(s){ return (s || "").toString().trim().toLowerCase(); }
function isNarrowScreen(){ return window.innerWidth <= 520; }
function isLandscapeTight(){ return window.matchMedia("(orientation: landscape) and (max-height: 520px)").matches; }

function loadCSVForLetter(letter){
  return new Promise((resolve, reject) => {
    const url = `${BASE}data_by_state_${letter}.csv`;
    Papa.parse(url, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: res => resolve(res.data),
      error: err => reject(err)
    });
  });
}

function toNum(x){
  const v = +x;
  return Number.isFinite(v) ? v : null;
}

function percentile(arr, p){
  const xs = arr.filter(v => Number.isFinite(v)).sort((a,b)=>a-b);
  if(xs.length === 0) return null;
  const idx = (p/100) * (xs.length - 1);
  const lo = Math.floor(idx), hi = Math.ceil(idx);
  if(lo === hi) return xs[lo];
  const w = idx - lo;
  return xs[lo]*(1-w) + xs[hi]*w;
}

function metricTitle(metric){
  if(metric === "percentage") return "Percentage";
  if(metric === "rank") return "Rank";
  if(metric === FEMALE_SHARE_METRIC) return "Sex Balance";
  return "Frequency";
}

function updateMetricOptions(){
  const sexChoice = document.getElementById("sexSelect").value;
  const metricSelect = document.getElementById("metricSelect");
  const current = metricSelect.value;

  const has = Array.from(metricSelect.options).some(o => o.value === FEMALE_SHARE_METRIC);

  if(sexChoice === "combined"){
    if(!has){
      const opt = document.createElement("option");
      opt.value = FEMALE_SHARE_METRIC;
      opt.textContent = "Sex Balance";
      metricSelect.appendChild(opt);
    }
  } else {
    for(const opt of Array.from(metricSelect.options)){
      if(opt.value === FEMALE_SHARE_METRIC) metricSelect.removeChild(opt);
    }
    if(current === FEMALE_SHARE_METRIC){
      metricSelect.value = "percentage";
    }
  }
}

function hoverTemplate(metric){
  if(metric === FEMALE_SHARE_METRIC){
    return (
      "State: %{customdata[0]}" +
      "<br>% Female: %{customdata[1]:.1%}" +
      "<br># Female: %{customdata[2]:,.0f}" +
      "<br># Male: %{customdata[3]:,.0f}" +
      "<extra></extra>"
    );
  }

  const boldFreq = (metric === "frequency") ? "<b>Freq: %{customdata[1]:,.0f}</b>" : "Freq: %{customdata[1]:,.0f}";
  const boldPct  = (metric === "percentage") ? "<b>Pct: %{customdata[2]:.2f}%</b>" : "Pct: %{customdata[2]:.2f}%";
  const boldRank = (metric === "rank") ? "<b>Rank: %{customdata[3]:,.0f}</b>" : "Rank: %{customdata[3]:,.0f}";

  return (
    "State: %{customdata[0]}" +
    "<br>" + boldFreq +
    "<br>" + boldPct +
    "<br>" + boldRank +
    "<extra></extra>"
  );
}

function missingFill(metric){
  if(metric === FEMALE_SHARE_METRIC) return 0.5;
  return (metric === "rank") ? 4000 : 0;
}

function sexHighColor(sexChoice){
  if(sexChoice === "M") return "#0000A3";
  if(sexChoice === "F") return "#ad028e";
  return "#640191";
}

function colorscaleFor(sexChoice, metric){
  if(metric === FEMALE_SHARE_METRIC){
    return FEMALE_SHARE_SCALE;
  }
  const low = "#ebebeb";
  const high = sexHighColor(sexChoice);
  if(metric === "rank"){
    return [[0, high], [1, low]];
  }
  return [[0, low], [1, high]];
}

function buildCombined(rows){
  const map = new Map();
  for(const r of rows){
    const key = `${r.year}|${r.State}`;
    if(!map.has(key)){
      map.set(key, {
        name: r.name,
        year: r.year,
        State: r.State,
        sex: "combined",
        frequency: 0,
        overall_percentage: r.overall_percentage,
        overall_rank: r.overall_rank
      });
    }
    const o = map.get(key);
    if(Number.isFinite(r.frequency)) o.frequency += r.frequency;
    if(!Number.isFinite(o.overall_percentage) && Number.isFinite(r.overall_percentage)) o.overall_percentage = r.overall_percentage;
    if(!Number.isFinite(o.overall_rank) && Number.isFinite(r.overall_rank)) o.overall_rank = r.overall_rank;
  }
  return Array.from(map.values());
}

function getMetricValue(row, sexChoice, metric){
  if(metric === FEMALE_SHARE_METRIC){
    return row.female_share;
  }
  if(sexChoice === "combined"){
    if(metric === "percentage") return row.overall_percentage;
    if(metric === "rank") return row.overall_rank;
    return row.frequency;
  }
  if(metric === "percentage") return row.percentage;
  if(metric === "rank") return row.rank;
  return row.frequency;
}

function buildFemaleShareRows(baseRows){
  const map = new Map();
  for(const r of baseRows){
    const key = `${r.year}|${r.State}`;
    if(!map.has(key)){
      map.set(key, { year: r.year, State: r.State, male_freq: 0, female_freq: 0 });
    }
    const o = map.get(key);
    if(Number.isFinite(r.frequency)){
      if(r.sex === "M") o.male_freq += r.frequency;
      if(r.sex === "F") o.female_freq += r.frequency;
    }
  }

  const out = [];
  for(const o of map.values()){
    const denom = o.male_freq + o.female_freq;
    const share = (denom > 0) ? (o.female_freq / denom) : 0.5;
    out.push({
      year: o.year,
      State: o.State,
      female_share: share,
      male_freq: o.male_freq,
      female_freq: o.female_freq
    });
  }
  return out;
}

function computeColorAxisRangeP95(rows, sexChoice, metric){
  if(metric === FEMALE_SHARE_METRIC){
    return { cmin: 0, cmax: 1, cmid: 0.5 };
  }

  const vals = rows
    .map(r => getMetricValue(r, sexChoice, metric))
    .filter(v => Number.isFinite(v));

  if(vals.length === 0){
    if(metric === "rank"){
      return { cmin: Math.log10(1), cmax: Math.log10(4000), minRaw: 1, maxRaw: 4000 };
    }
    return { cmin: 0, cmax: 1 };
  }

  if(metric === "rank"){
    const ranks = vals.map(v => Math.max(1, v));
    const minRank = Math.min(...ranks);
    let p95Rank = percentile(ranks, 95);
    if(!Number.isFinite(p95Rank)) p95Rank = Math.max(...ranks);

    const cmin = Math.log10(minRank);
    const cmax = Math.log10(Math.max(p95Rank, minRank * 1.01));
    return { cmin, cmax, minRaw: minRank, maxRaw: p95Rank };
  }

  const cmin = 0;
  let cmax = percentile(vals, 95);
  if(!Number.isFinite(cmax)) cmax = Math.max(...vals);
  if(!(cmax > cmin)) cmax = cmin + 1e-9;
  return { cmin, cmax };
}

function buildYearStateStatsLookup(rowsForFrames, sexChoice){
  const byYear = new Map();
  for(const r of rowsForFrames){
    if(!byYear.has(r.year)) byYear.set(r.year, new Map());

    const freq = Number.isFinite(r.frequency) ? r.frequency : 0;
    const pct  = (sexChoice === "combined")
      ? (Number.isFinite(r.overall_percentage) ? r.overall_percentage : 0)
      : (Number.isFinite(r.percentage) ? r.percentage : 0);

    const rk   = (sexChoice === "combined")
      ? (Number.isFinite(r.overall_rank) ? r.overall_rank : 4000)
      : (Number.isFinite(r.rank) ? r.rank : 4000);

    byYear.get(r.year).set(r.State, { freq, pct, rk });
  }
  return byYear;
}

function buildYearStateValueLookup(rowsForFrames, sexChoice, metric){
  const byYear = new Map();
  for(const r of rowsForFrames){
    const v = getMetricValue(r, sexChoice, metric);
    if(!Number.isFinite(v)) continue;
    if(!byYear.has(r.year)) byYear.set(r.year, new Map());
    byYear.get(r.year).set(r.State, v);
  }
  return byYear;
}

function buildYearStateLookupFemaleShare(rows){
  const byYear = new Map();
  for(const r of rows){
    if(!byYear.has(r.year)) byYear.set(r.year, new Map());
    byYear.get(r.year).set(r.State, {
      share: r.female_share,
      female_freq: r.female_freq,
      male_freq: r.male_freq
    });
  }
  return byYear;
}

function buildColorbar(metric, range){
  const titleText = metricTitle(metric);

  if(metric === "percentage"){
    return { title: { text: titleText, side: "top" }, tickformat: ".2f", ticksuffix: "%" };
  }
  if(metric === "frequency"){
    return { title: { text: titleText, side: "top" }, tickformat: ",.0f" };
  }
  if(metric === FEMALE_SHARE_METRIC){
    return {
      title: { text: titleText, side: "top" },
      tickformat: ".0%",
      tickvals: [0, 0.25, 0.5, 0.75, 1],
      ticktext: ["0%", "25%", "50%", "75%", "100%"]
    };
  }

  const candidates = Array.from(new Set([range.minRaw ?? 1, 10, 100, 1000, 4000]))
    .filter(x => Number.isFinite(x) && x >= 1)
    .sort((a,b)=>a-b);

  const tickvals = [];
  const ticktext = [];
  for(const r of candidates){
    const lv = Math.log10(Math.max(1, r));
    if(lv >= range.cmin - 1e-12 && lv <= range.cmax + 1e-12){
      tickvals.push(lv);
      ticktext.push(String(Math.round(r)));
    }
  }

  return { title: { text: titleText, side: "top" }, tickvals, ticktext };
}

function colorbarLayout(metric, range){
  const base = buildColorbar(metric, range);

  if(isNarrowScreen()){
    // Keep above slider; compact in tight landscape
    const tight = isLandscapeTight();
    return Object.assign({}, base, {
      orientation: "h",
      x: 0.5,
      xanchor: "center",
      y: tight ? 0.075 : 0.06,
      yanchor: "bottom",
      len: 0.92,
      thickness: tight ? 8 : 10
    });
  }

  return Object.assign({}, base, {
    orientation: "v",
    x: 1.02,
    xanchor: "left",
    y: 0.5,
    yanchor: "middle",
    len: 0.9,
    thickness: 14
  });
}

function buildAnimatedChoropleth(rowsForFrames, rowsForRange, lookupValue, lookupStats, name, sexChoice, metric){
  const years = Array.from(new Set(rowsForFrames.map(r => r.year))).sort((a,b)=>a-b);
  if(years.length === 0) throw new Error("No usable year values after filtering.");

  const fillRaw = missingFill(metric);
  const range = computeColorAxisRangeP95(rowsForRange, sexChoice, metric);
  const scale = colorscaleFor(sexChoice, metric);

  function frameDataForYear(y){
    const valMap = lookupValue.get(y) || new Map();
    const statMap = lookupStats.get(y) || new Map();
    const locations = ALL_STATES.slice();

    if(metric === FEMALE_SHARE_METRIC){
      const z = [];
      const customdata = [];
      for(const st of locations){
        if(valMap.has(st)){
          const obj = valMap.get(st);
          const share = Number.isFinite(obj.share) ? obj.share : 0.5;
          z.push(share);
          customdata.push([st, share, obj.female_freq ?? 0, obj.male_freq ?? 0]);
        } else {
          z.push(0.5);
          customdata.push([st, 0.5, 0, 0]);
        }
      }
      return {locations, z, customdata};
    }

    const z = [];
    const customdata = [];

    for(const st of locations){
      const stats = statMap.get(st) || { freq: 0, pct: 0, rk: 4000 };

      let raw = valMap.has(st) ? valMap.get(st) : fillRaw;
      if(metric === "rank"){
        raw = Math.max(1, raw);
        z.push(Math.log10(raw));
      } else {
        z.push(raw);
      }

      customdata.push([st, stats.freq, stats.pct, stats.rk]);
    }

    return {locations, z, customdata};
  }

  const d0 = frameDataForYear(years[0]);

  const trace = {
    type: "choropleth",
    locationmode: "USA-states",
    locations: d0.locations,
    z: d0.z,
    customdata: d0.customdata,
    hovertemplate: hoverTemplate(metric),
    coloraxis: "coloraxis",
    marker: { line: { color: "white", width: 0.7 } }
  };

  const frames = years.map(y => {
    const d = frameDataForYear(y);
    return { name: String(y), data: [{ locations: d.locations, z: d.z, customdata: d.customdata }] };
  });

  const steps = years.map(y => ({
    method: "animate",
    label: String(y),
    args: [[String(y)], { mode: "immediate", transition: {duration: 0}, frame: {duration: 250, redraw: true} }]
  }));

  const title = `${name} by State`;
  const narrow = isNarrowScreen();
  const tight = isLandscapeTight();

  // Reduce vertical gap between map and slider:
  // - move slider up slightly (y)
  // - reduce slider pad.t
  // - reduce bottom margin in tight landscape while still reserving room for colorbar+slider
  const bottomMargin = narrow ? (tight ? 44 : 76) : 12;

// Pull slider up as far as possible in tight landscape.
// This may slightly overlap the map area, which you said is OK.
const sliderY = tight ? 0.20 : 0.00;

// Remove extra vertical padding so the slider hugs the map.
const sliderPadT = tight ? 0 : (narrow ? 6 : 18);


  const layout = {
    title: {
      text: title,
      x: 0.5,
      y: 1.0,
      yref: "paper",
      yanchor: "top",
      font: { size: narrow ? 16 : 18 },
      pad: { t: 0, b: 0 }
    },
    geo: { scope: "usa" },
    margin: { l: 8, r: 8, t: narrow ? 24 : 28, b: bottomMargin },
    dragmode: false,

    coloraxis: {
      colorscale: scale,
      cmin: range.cmin,
      cmax: range.cmax,
      ...(Number.isFinite(range.cmid) ? { cmid: range.cmid } : {}),
      colorbar: colorbarLayout(metric, range)
    },

    sliders: [{
      active: 0,
      x: 0.02,
      y: sliderY,
      xanchor: "left",
      len: 0.96,
      pad: { t: sliderPadT, b: 0 },
      currentvalue: { prefix: "Year: ", visible: true, xanchor: "right" },
      steps: steps
    }]
  };

  return { data: [trace], layout, frames };
}

async function render(){
  const nameRaw = document.getElementById("nameInput").value.trim();
  const sexChoice = document.getElementById("sexSelect").value;
  const metric = document.getElementById("metricSelect").value;

  if(!nameRaw){ setStatus("Enter a name first."); return; }

  const letter = nameRaw[0].toUpperCase();
  setStatus("Loading…");

  try{
    if(cached.letter !== letter || !cached.rows){
      cached.rows = await loadCSVForLetter(letter);
      cached.letter = letter;
    }

    const nameLower = nameRaw.toLowerCase();

    let baseRows = cached.rows
      .map(r => ({
        name: (r.name || "").trim(),
        year: toNum(r.year),
        sex: (r.sex || "").trim(),
        State: (r.State || "").trim(),
        frequency: toNum(r.frequency),
        percentage: toNum(r.percentage),
        rank: toNum(r.rank),
        overall_percentage: toNum(r.overall_percentage),
        overall_rank: toNum(r.overall_rank)
      }))
      .filter(r =>
        safeLower(r.name) === nameLower &&
        Number.isFinite(r.year) &&
        r.State && r.State.length === 2 &&
        (r.sex === "M" || r.sex === "F")
      );

    if(baseRows.length === 0){
      setStatus(`No data found for "${nameRaw}" in the ${letter} file.`);
      Plotly.purge("plot");
      return;
    }

    const gd = document.getElementById("plot");
    let activeYear = null;
    try{
      if(gd && gd._fullLayout?.sliders?.[0]){
        const s = gd._fullLayout.sliders[0];
        activeYear = s.steps?.[s.active]?.label ?? null;
      }
    }catch(e){}

    let rowsForFrames, rowsForRange, lookupValue, lookupStats;

    if(sexChoice === "combined" && metric === FEMALE_SHARE_METRIC){
      rowsForFrames = buildFemaleShareRows(baseRows);
      rowsForRange = rowsForFrames;
      lookupValue = buildYearStateLookupFemaleShare(rowsForFrames);
      lookupStats = new Map();
    } else {
      if(sexChoice === "combined"){
        rowsForFrames = buildCombined(baseRows);
      } else {
        rowsForFrames = baseRows.filter(r => r.sex === sexChoice);
      }

      rowsForFrames = rowsForFrames.filter(r => Number.isFinite(getMetricValue(r, sexChoice, metric)));
      rowsForRange = rowsForFrames;

      lookupValue = buildYearStateValueLookup(rowsForFrames, sexChoice, metric);
      lookupStats = buildYearStateStatsLookup(rowsForFrames, sexChoice);
    }

    if(rowsForFrames.length === 0){
      setStatus(`No usable data for "${nameRaw}" after applying Sex/Metric filters.`);
      Plotly.purge("plot");
      return;
    }

    const fig = buildAnimatedChoropleth(rowsForFrames, rowsForRange, lookupValue, lookupStats, nameRaw, sexChoice, metric);

    await Plotly.newPlot("plot", fig.data, fig.layout, {
      responsive: true,
      displayModeBar: false,
      scrollZoom: false,
      doubleClick: false
    });
    Plotly.addFrames("plot", fig.frames);

    if(activeYear && fig.frames.some(fr => fr.name === String(activeYear))){
      Plotly.animate("plot", [String(activeYear)], {
        mode: "immediate",
        transition: {duration: 0},
        frame: {duration: 0, redraw: true}
      });
    }

    setStatus("");
  }catch(err){
    console.error(err);
    setStatus("Error: " + (err?.message || err));
    Plotly.purge("plot");
  }
}

document.getElementById("goBtn").addEventListener("click", render);
document.getElementById("nameInput").addEventListener("keydown", e => { if(e.key === "Enter") render(); });

document.getElementById("sexSelect").addEventListener("change", () => {
  updateMetricOptions();
  if(document.getElementById("nameInput").value.trim()) render();
});
document.getElementById("metricSelect").addEventListener("change", () => {
  if(document.getElementById("nameInput").value.trim()) render();
});

updateMetricOptions();

window.addEventListener("message", (event) => {
  const d = event.data || {};
  if(d.type !== "SET_INPUTS_AND_RUN") return;
  if(typeof d.name === "string"){
    document.getElementById("nameInput").value = d.name;
    render();
  }
});

window.addEventListener("resize", () => {
  if(document.getElementById("nameInput").value.trim()){
    clearTimeout(window.__mapResizeTimer);
    window.__mapResizeTimer = setTimeout(() => render(), 150);
  }
});
</script>
</body>
</html>
