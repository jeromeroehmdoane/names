<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Summary</title>

  <style>
    :root{
      --text:#111827;
      --muted:#6b7280;
      --border:#e6e8eb;
      --panel:#ffffff;
      --shadow:0 10px 30px rgba(0,0,0,0.08);
      --r:14px;

      /* Match index background dark blue */
      --deep:#0b1220;

      /* Meter base gradient (light -> deep) */
      --light:#f7fafc;

      /* Marker styles */
      --markerFill:#60a5fa; /* subtle but visible */
      --markerBorder:#ffffff;
      --markerHalo:rgba(96,165,250,0.22);

      --barBorder:rgba(17,24,39,0.10);

      --tooltip:#111827;
      --tooltipText:#ffffff;
    }

    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      line-height: 1.35;
      margin: 24px;
      color:var(--text);
      background:#fff;
    }

    /* Hide local controls (keep in DOM for message bridge + internal wiring) */
    #localControls { display:none; }

    .hint{
      max-width: 900px;
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .error { color: #b00020; white-space: pre-wrap; }

    .card {
      max-width: 900px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: var(--r);
      background: var(--panel);
      margin-top: 12px;
      box-shadow: var(--shadow);
    }

    h2 { margin: 0 0 10px; font-size: 16px; font-weight: 700; }

    .bold-row td { font-weight: 700; }

    table { border-collapse: collapse; width: 100%; max-width: 900px; margin: 8px 0 16px; background:#fff; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #f1f3f5; }

    /* ---------- Text blocks (replace gray <pre>) ---------- */
    .statBlock{
      border: 1px solid rgba(17,24,39,0.08);
      background: linear-gradient(180deg, #ffffff, #fbfcfe);
      border-radius: 12px;
      padding: 12px 12px 10px;
      margin-top: 10px;
    }
    .statText{
      margin: 0;
      font-size: 14px;
      line-height: 1.35;
      white-space: pre-wrap;
    }

    /* ---------- Overall summary stack ---------- */
    .overallStack{ display:grid; gap:12px; margin-top: 8px; }

    /* ---------- Meters ---------- */
    .meterWrap{ display:grid; gap:6px; margin-top: 10px; }
    .meterLabels{
      display:flex;
      justify-content:space-between;
      gap:10px;
      font-size:12px;
      color: var(--muted);
    }
    .meterBar{
      position: relative;
      height: 12px;
      border-radius: 999px;
      border: 1px solid var(--barBorder);
      overflow: visible;
      background: linear-gradient(90deg, var(--light), var(--deep));
    }
    .meterBar.sex{
      background: linear-gradient(90deg, #fbcfe8, #ffffff, #93c5fd);
    }

    /* Marker: dot + tick; visible on light and dark backgrounds */
    .meterMarker{
      position:absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: var(--markerFill);
      border: 2px solid var(--markerBorder);
      box-shadow: 0 0 0 6px var(--markerHalo);
      cursor: default;
      z-index: 2;
    }
    .meterMarker::before{
      content:"";
      position:absolute;
      left:50%;
      top:50%;
      transform: translate(-50%, -50%);
      width: 2px;
      height: 18px;
      border-radius: 2px;
      background: rgba(255,255,255,0.65);
      box-shadow: 0 0 0 1px rgba(0,0,0,0.25);
      z-index: -1;
    }

    /* Desktop-only hover tooltip */
    @media (hover:hover) and (pointer:fine){
      .meterMarker[data-tip]::after{
        content: attr(data-tip);
        position:absolute;
        left:50%;
        transform: translate(-50%, calc(-100% - 12px));
        background: var(--tooltip);
        color: var(--tooltipText);
        font-size: 12px;
        padding: 6px 8px;
        border-radius: 8px;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transition: opacity 120ms ease;
        filter: drop-shadow(0 10px 20px rgba(0,0,0,0.25));
      }
      .meterMarker:hover::after{ opacity: 1; }
    }

    @media (max-width: 520px){
      body{ margin: 16px; }
      .meterLabels{ font-size:11px; }
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>

<body>
  <!-- No "Name Summary" header here; index already labels the section -->
  <div id="messages" class="hint">Enter a name above.</div>

  <!-- Hidden local controls retained for internal wiring + bridge -->
  <div id="localControls">
    <input id="nameInput" />
    <input id="stateInput" />
    <input id="yearInput" />
    <button id="runBtn">Generate</button>
  </div>

  <div id="output"></div>

<script>
(() => {
  // ============================================================
  // Constants / URLs
  // ============================================================
  const BASE_RAW = "https://raw.githubusercontent.com/jeromeroehmdoane/names/refs/heads/main/";

  const URLS = {
    overall_summary: BASE_RAW + "all_names_stat_summary.csv",
    top_names_national_yearly: BASE_RAW + "top_names_national_yearly.csv",
    top_names_state_yearly: BASE_RAW + "top_names_state_yearly.csv",
    state_representation: BASE_RAW + "state_representation.csv",
    small_data_group: (grp) => BASE_RAW + `small_data_${grp}.csv`,
    data_by_state_letter: (letter) => BASE_RAW + `data_by_state_${letter}.csv`,
  };

  const groups = ["ABCD", "EFGH", "IJKL", "MNOP", "QRST", "UVWXYZ"];

  const STATE_NAMES = {
    "AL":"Alabama","AK":"Alaska","AZ":"Arizona","AR":"Arkansas","CA":"California","CO":"Colorado","CT":"Connecticut",
    "DE":"Delaware","DC":"District of Columbia","FL":"Florida","GA":"Georgia","HI":"Hawaii","ID":"Idaho","IL":"Illinois",
    "IN":"Indiana","IA":"Iowa","KS":"Kansas","KY":"Kentucky","LA":"Louisiana","ME":"Maine","MD":"Maryland","MA":"Massachusetts",
    "MI":"Michigan","MN":"Minnesota","MS":"Mississippi","MO":"Missouri","MT":"Montana","NE":"Nebraska","NV":"Nevada",
    "NH":"New Hampshire","NJ":"New Jersey","NM":"New Mexico","NY":"New York","NC":"North Carolina","ND":"North Dakota",
    "OH":"Ohio","OK":"Oklahoma","OR":"Oregon","PA":"Pennsylvania","RI":"Rhode Island","SC":"South Carolina","SD":"South Dakota",
    "TN":"Tennessee","TX":"Texas","UT":"Utah","VT":"Vermont","VA":"Virginia","WA":"Washington","WV":"West Virginia",
    "WI":"Wisconsin","WY":"Wyoming"
  };

  // ============================================================
  // Helpers
  // ============================================================
  function ordinal(n) {
    n = parseInt(n, 10);
    if (!Number.isFinite(n)) return "N/A";
    if (10 <= (n % 100) && (n % 100) <= 20) return `${n}th`;
    const suf = ({1:"st", 2:"nd", 3:"rd"}[n % 10]) || "th";
    return `${n}${suf}`;
  }

  function pct(x, decimals = 1) {
    const v = Number(x);
    if (!Number.isFinite(v)) return "N/A";
    return `${(100 * v).toFixed(decimals)}%`;
  }

  async function loadCSV(url) {
    return new Promise((resolve, reject) => {
      Papa.parse(url, {
        download: true,
        header: true,
        dynamicTyping: false,
        skipEmptyLines: true,
        complete: (results) => resolve(results.data),
        error: (err) => reject(err),
      });
    });
  }

  function groupSum(rows, keyFields, sumField) {
    const map = new Map();
    for (const r of rows) {
      const key = keyFields.map(k => (r[k] ?? "")).join("||");
      const prev = map.get(key);
      const addVal = Number(r[sumField] ?? 0) || 0;
      if (!prev) {
        const obj = {};
        for (const k of keyFields) obj[k] = r[k];
        obj[sumField] = addVal;
        map.set(key, obj);
      } else {
        prev[sumField] = (Number(prev[sumField]) || 0) + addVal;
      }
    }
    return Array.from(map.values());
  }

  function sortByNumericField(rows, field, asc = true) {
    const mult = asc ? 1 : -1;
    return rows.slice().sort((a,b) => {
      const av = Number(a[field]); const bv = Number(b[field]);
      if (!Number.isFinite(av) && !Number.isFinite(bv)) return 0;
      if (!Number.isFinite(av)) return 1;
      if (!Number.isFinite(bv)) return -1;
      return mult * (av - bv);
    });
  }

  function toLowerTrim(s) {
    return String(s ?? "").trim().toLowerCase();
  }

  function clamp01(x){
    const v = Number(x);
    if (!Number.isFinite(v)) return 0;
    return Math.min(1, Math.max(0, v));
  }

  function clearOutput() {
    document.getElementById("output").innerHTML = "";
  }

  function setHint(text){
    const el = document.getElementById("messages");
    if (!el) return;
    el.className = "hint";
    el.textContent = text;
  }

  function setError(text){
    const el = document.getElementById("messages");
    if (!el) return;
    el.className = "hint error";
    el.textContent = text;
  }

  function renderTable(container, title, rows, columns, opts = {}) {
    const { boldRowPredicate } = opts;

    const wrap = document.createElement("div");
    const h = document.createElement("div");
    h.innerHTML = `<div class="muted" style="margin-top:10px;"><strong>${title}</strong></div>`;
    wrap.appendChild(h);

    const table = document.createElement("table");
    const thead = document.createElement("thead");
    const trh = document.createElement("tr");
    for (const c of columns) {
      const th = document.createElement("th");
      th.textContent = c;
      trh.appendChild(th);
    }
    thead.appendChild(trh);
    table.appendChild(thead);

    const tbody = document.createElement("tbody");
    for (const r of rows) {
      const tr = document.createElement("tr");
      if (typeof boldRowPredicate === "function" && boldRowPredicate(r)) {
        tr.classList.add("bold-row");
      }
      for (const c of columns) {
        const td = document.createElement("td");
        td.textContent = (r[c] ?? "").toString();
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }
    table.appendChild(tbody);

    wrap.appendChild(table);
    container.appendChild(wrap);
  }

  function makeTextBlock(text){
    const blk = document.createElement("div");
    blk.className = "statBlock";
    const p = document.createElement("p");
    p.className = "statText";
    p.textContent = text;
    blk.appendChild(p);
    return blk;
  }

  // ---------- Meter component ----------
  function makeMeter({ leftLabel, rightLabel, value01, tooltip, variant }) {
    const wrap = document.createElement("div");
    wrap.className = "meterWrap";

    const labels = document.createElement("div");
    labels.className = "meterLabels";
    labels.innerHTML = `<span>${leftLabel}</span><span>${rightLabel}</span>`;

    const bar = document.createElement("div");
    bar.className = "meterBar" + (variant ? ` ${variant}` : "");

    const marker = document.createElement("div");
    marker.className = "meterMarker";
    marker.style.left = `${(100 * clamp01(value01)).toFixed(2)}%`;
    if (tooltip) marker.setAttribute("data-tip", tooltip);

    bar.appendChild(marker);
    wrap.appendChild(labels);
    wrap.appendChild(bar);
    return wrap;
  }

  // ---------- Overall summary renderer ----------
  function renderOverallSummary(overallCard, data) {
    overallCard.innerHTML = `<h2>Overall Summary (All Time)</h2>`;

    const stack = document.createElement("div");
    stack.className = "overallStack";

    // 1) Popularity: Least -> Most (left -> right), marker at rank percentile
    const line1 =
      `${data.name} is the ${ordinal(data.rank_all_time)} most popular US name of all time ` +
      `(${data.rank_pct.toFixed(0)}th percentile) with ${data.total_all_time.toLocaleString()} ${data.name}'s born.`;

    const b1 = document.createElement("div");
    b1.className = "statBlock";
    b1.appendChild(Object.assign(document.createElement("p"), { className:"statText", textContent: line1 }));
    b1.appendChild(makeMeter({
      leftLabel: "Least popular",
      rightLabel: "Most popular",
      value01: clamp01(data.rank_pct / 100),
      tooltip: `${data.rank_pct.toFixed(0)}th percentile`
    }));
    stack.appendChild(b1);

    // 2) Sex: pink -> white -> blue
    const line2 = `${data.sex_word} ${data.name}'s are ${data.dominant_sex} (${pct(data.dominant_prop, 1)}).`;
    const b2 = document.createElement("div");
    b2.className = "statBlock";
    b2.appendChild(Object.assign(document.createElement("p"), { className:"statText", textContent: line2 }));
    b2.appendChild(makeMeter({
      leftLabel: "All girls",
      rightLabel: "All boys",
      value01: clamp01(data.prop_male),
      tooltip: `${pct(data.prop_male, 1)} boys`,
      variant: "sex"
    }));
    stack.appendChild(b2);

    // 3) Mean birth year: Older -> Younger (low -> high)
    const line3 =
      `The average birth year was ${data.mean_year.toFixed(0)} ` +
      `(${data.mean_year_pct.toFixed(0)}th percentile – ${data.age_word} than most).`;

    const b3 = document.createElement("div");
    b3.className = "statBlock";
    b3.appendChild(Object.assign(document.createElement("p"), { className:"statText", textContent: line3 }));
    b3.appendChild(makeMeter({
      leftLabel: "Older",
      rightLabel: "Younger",
      value01: clamp01(data.mean_year_pct / 100),
      tooltip: `${data.mean_year_pct.toFixed(0)}th percentile`
    }));
    stack.appendChild(b3);

    // 4) Peak block + Trendiness meter: Timeless -> Trendy
    const b4 = document.createElement("div");
    b4.className = "statBlock";
    const t4 = document.createElement("p");
    t4.className = "statText";
    t4.textContent =
      `Peak frequency came in ${data.peak_year} with ${data.peak_freq.toLocaleString()} births.\n` +
      `The peak 10 year window was ${data.win_start} to ${data.win_end} with ${pct(data.win_prop, 1)} of all ${data.name}'s born in that time.\n` +
      `That puts its trendy/timeless percentile as ${data.trend_pct.toFixed(0)}% – ${data.trend_word}.`;
    b4.appendChild(t4);
    b4.appendChild(makeMeter({
      leftLabel: "Timeless",
      rightLabel: "Trendy",
      value01: clamp01(data.trend_pct / 100),
      tooltip: `${data.trend_pct.toFixed(0)}th percentile`
    }));
    stack.appendChild(b4);

    // 5) Scrabble: Lower -> Higher
    const line5 = `The Scrabble score for ${data.name} is ${data.scrabble_score_val}. (${data.scrabble_pct.toFixed(0)}th percentile) `;
    const b5 = document.createElement("div");
    b5.className = "statBlock";
    b5.appendChild(Object.assign(document.createElement("p"), { className:"statText", textContent: line5 }));
    b5.appendChild(makeMeter({
      leftLabel: "Lower",
      rightLabel: "Higher",
      value01: clamp01(data.scrabble_pct / 100),
      tooltip: `${data.scrabble_pct.toFixed(0)}th percentile`
    }));
    stack.appendChild(b5);

    overallCard.appendChild(stack);
  }

  // ============================================================
  // Main logic
  // ============================================================
  async function writeSummaryHTML(name, state, year) {
    clearOutput();

    try {
      name = String(name ?? "").trim();
      const stateRaw = String(state ?? "").trim().toUpperCase();
      const yearRaw = String(year ?? "").trim();
      const yearNum = (yearRaw === "") ? NaN : parseInt(yearRaw, 10);

      const hasState = (stateRaw.length === 2);
      const hasYear = Number.isFinite(yearNum);

      if (!name) {
        setHint("Enter a name above.");
        return;
      }

      setHint(""); // remove hint once we have a name

      const firstLetter = name[0].toUpperCase();
      const firstLetterGroup = groups.find(g => g.includes(firstLetter));
      if (!firstLetterGroup) {
        setError(`Error: First letter '${firstLetter}' not in any defined group.`);
        return;
      }

      const out = document.getElementById("output");

      // ============================================================
      // 1) OVERALL SUMMARY (ALL TIME)
      // ============================================================
      const overall_summary = await loadCSV(URLS.overall_summary);
      const match = overall_summary.filter(r => toLowerTrim(r["name"]) === name.toLowerCase());

      const overallCard = document.createElement("div");
      overallCard.className = "card";
      out.appendChild(overallCard);

      if (match.length === 0) {
        overallCard.innerHTML = `<h2>Overall Summary (All Time)</h2>`;
        overallCard.appendChild(makeTextBlock(`No overall summary data found for name '${name}'.`));
      } else {
        const r = match[0];

        const total_all_time = parseInt(r["total_frequency"], 10);
        const rank_all_time = parseInt(r["all_time_rank"], 10);
        const rank_pct = Number(r["all_time_percentile"]);

        const prop_male = Number(r["prop_male"]);
        const dominant_sex = (prop_male >= 0.5) ? "boys" : "girls";
        const dominant_prop = (dominant_sex === "boys") ? prop_male : (1.0 - prop_male);

        let sex_word;
        if (dominant_prop >= 0.95) sex_word = "Nearly all";
        else if (dominant_prop >= 0.80) sex_word = "Most";
        else if (dominant_prop >= 0.65) sex_word = "A majority of";
        else sex_word = "About half of";

        const mean_year = Number(r["birth_year_mean"]);
        const mean_year_pct = Number(r["mean_birth_year_percentile"]);
        const age_word = (mean_year_pct < 50) ? "older" : "younger";

        const peak_freq = parseInt(r["peak_frequency"], 10);
        const peak_year = parseInt(r["peak_frequency_year"], 10);

        const win_start = parseInt(r["best10_start"], 10);
        const win_end = parseInt(r["best10_end"], 10);
        const win_prop = Number(r["best10_prop"]);

        const scrabble_score_val = parseInt(r["scrabble_score"], 10);
        const scrabble_pct = Number(r["scrabble_score_percentile"]);

        const trend_pct = Number(r["trendiness_percentile"]);
        let trend_word;
        if (trend_pct >= 85) trend_word = "very trendy";
        else if (trend_pct >= 65) trend_word = "moderately trendy";
        else if (trend_pct >= 50) trend_word = "slightly more trendy than timeless";
        else if (trend_pct >= 35) trend_word = "moderately timeless";
        else trend_word = "very timeless";

        renderOverallSummary(overallCard, {
          name,
          total_all_time,
          rank_all_time,
          rank_pct,
          prop_male,
          dominant_sex,
          dominant_prop,
          sex_word,
          mean_year,
          mean_year_pct,
          age_word,
          peak_freq,
          peak_year,
          win_start,
          win_end,
          win_prop,
          trend_pct,
          trend_word,
          scrabble_score_val,
          scrabble_pct
        });
      }

      // ============================================================
      // 2) NATIONAL SUMMARY
      // ============================================================
      if (!Number.isFinite(parseInt(yearRaw, 10))) {
        const yearCard = document.createElement("div");
        yearCard.className = "card";
        yearCard.innerHTML = `<h2>National Summary (All Time)</h2>`;
        out.appendChild(yearCard);

        const top5_alltime = overall_summary
          .filter(r => Number(r["all_time_rank"]) <= 5)
          .map(r => ({
            name: r["name"],
            all_time_rank: r["all_time_rank"],
            total_frequency: r["total_frequency"]
          }));

        const target_alltime = (match.length > 0)
          ? {
              name: match[0]["name"],
              all_time_rank: match[0]["all_time_rank"],
              total_frequency: match[0]["total_frequency"]
            }
          : null;

        let tableData = top5_alltime.slice().sort((a,b) => Number(a.all_time_rank) - Number(b.all_time_rank));

        if (target_alltime) {
          const targetRank = Number(target_alltime.all_time_rank);
          const inTop5 = tableData.some(r => toLowerTrim(r.name) === toLowerTrim(target_alltime.name));

          if (Number.isFinite(targetRank) && targetRank > 5 && !inTop5) {
            const dots = { name: "...", all_time_rank: "...", total_frequency: "..." };
            const insertIdx = tableData.filter(r => {
              const v = Number(r.all_time_rank);
              return Number.isFinite(v) && v < targetRank;
            }).length;

            tableData = [
              ...tableData.slice(0, insertIdx),
              dots,
              target_alltime,
              ...tableData.slice(insertIdx)
            ];
          } else if (!inTop5 && Number.isFinite(targetRank) && targetRank <= 5) {
            tableData.push(target_alltime);
            tableData = tableData.slice().sort((a,b) => Number(a.all_time_rank) - Number(b.all_time_rank));
          }
        }

        const nat_rows_alltime = tableData.map(r => ({
          "National Rank": r.all_time_rank,
          "Name": r.name,
          "Frequency": (r.total_frequency === "...") ? "..." : (Number(r.total_frequency) || 0).toLocaleString()
        }));

        renderTable(
          yearCard,
          `National Popularity Table (All Time):`,
          nat_rows_alltime,
          ["National Rank", "Name", "Frequency"],
          { boldRowPredicate: (r) => String(r["Name"]).toLowerCase() === name.toLowerCase() }
        );
      } else {
        const df_national_all = await loadCSV(URLS.small_data_group(firstLetterGroup));
        const df_national_name_year = df_national_all.filter(r =>
          String(r["name"]) === name && parseInt(r["year"], 10) === yearNum
        );

        const yearCard = document.createElement("div");
        yearCard.className = "card";
        yearCard.innerHTML = `<h2>National Summary (${yearNum})</h2>`;
        out.appendChild(yearCard);

        let overall_rank_us = null;
        let total_freq_us = 0;
        let male_freq_us = 0;
        let female_freq_us = 0;

        if (df_national_name_year.length === 0) {
          yearCard.appendChild(makeTextBlock(`No national data found for ${name} in ${yearNum}.`));
        } else {
          const target_name_national_agg = groupSum(
            df_national_name_year,
            ["name", "year", "overall_rank", "overall_percentage"],
            "frequency"
          );

          total_freq_us = target_name_national_agg.reduce((acc, r) => acc + (Number(r["frequency"]) || 0), 0) | 0;

          male_freq_us = df_national_name_year
            .filter(r => String(r["sex"]) === "M")
            .reduce((acc, r) => acc + (Number(r["frequency"]) || 0), 0) | 0;

          female_freq_us = df_national_name_year
            .filter(r => String(r["sex"]) === "F")
            .reduce((acc, r) => acc + (Number(r["frequency"]) || 0), 0) | 0;

          const overall_rank_us_val = (target_name_national_agg.length > 0) ? target_name_national_agg[0]["overall_rank"] : null;
          if (overall_rank_us_val !== null && overall_rank_us_val !== undefined && String(overall_rank_us_val).trim() !== "" && String(overall_rank_us_val).toLowerCase() !== "nan") {
            const v = Number(overall_rank_us_val);
            if (Number.isFinite(v)) overall_rank_us = parseInt(v, 10);
          }

          const rank_str = (overall_rank_us !== null) ? ordinal(overall_rank_us) : "N/A";

          const summary_text_year =
            `There were ${total_freq_us.toLocaleString()} babies born in the US with the name ${name} in ${yearNum} ` +
            `(${male_freq_us.toLocaleString()} M, ${female_freq_us.toLocaleString()} F).\n` +
            `It was the ${rank_str} most popular name nationwide that year.\n` +
            `See the tables below for more.`;

          yearCard.appendChild(makeTextBlock(summary_text_year));

          const df_national_top_all = await loadCSV(URLS.top_names_national_yearly);
          const df_national_top_year = df_national_top_all.filter(r => parseInt(r["year"], 10) === yearNum);

          let national_table_data = df_national_top_year.filter(r => Number(r["overall_rank"]) <= 5);
          national_table_data = groupSum(
            national_table_data,
            ["name", "overall_rank", "overall_percentage"],
            "frequency"
          );
          national_table_data = sortByNumericField(national_table_data, "overall_rank", true);

          const target_row = target_name_national_agg.slice(0, 1).map(r => ({
            name: r["name"],
            frequency: r["frequency"],
            overall_rank: r["overall_rank"],
            overall_percentage: r["overall_percentage"]
          }));

          if (target_row.length) {
            const target_rank = Number(target_row[0].overall_rank);
            const inTop5 = national_table_data.some(r => toLowerTrim(r.name) === name.toLowerCase());

            if (Number.isFinite(target_rank) && target_rank > 5 && !inTop5) {
              const dots = { name: "...", frequency: "...", overall_rank: "...", overall_percentage: "..." };
              const insert_idx = national_table_data.filter(r => {
                const v = Number(r.overall_rank);
                return Number.isFinite(v) && v < target_rank;
              }).length;

              national_table_data = [
                ...national_table_data.slice(0, insert_idx),
                dots,
                ...target_row,
                ...national_table_data.slice(insert_idx)
              ];
            } else if (!inTop5 && Number.isFinite(target_rank) && target_rank <= 5) {
              national_table_data.push(target_row[0]);
              national_table_data = groupSum(
                national_table_data,
                ["name", "overall_rank", "overall_percentage"],
                "frequency"
              );
              national_table_data = sortByNumericField(national_table_data, "overall_rank", true);
            }
          }

          const nat_rows = national_table_data.map(r => ({
            "National Rank": r.overall_rank,
            "Name": r.name,
            "Frequency": (r.frequency === "...") ? "..." : (Number(r.frequency) || 0).toLocaleString(),
            "Percentage": r.overall_percentage
          }));

          renderTable(
            yearCard,
            `National Popularity Table (${yearNum}):`,
            nat_rows,
            ["National Rank", "Name", "Frequency", "Percentage"],
            { boldRowPredicate: (r) => String(r["Name"]).toLowerCase() === name.toLowerCase() }
          );
        }
      }

      // ============================================================
      // 3) STATE SUMMARY
      // ============================================================
      const stateFull = hasState ? (STATE_NAMES[stateRaw] || stateRaw) : "State";
      const stateCard = document.createElement("div");
      stateCard.className = "card";
      if (hasState && hasYear) stateCard.innerHTML = `<h2>${stateFull} State Summary (${yearNum})</h2>`;
      else if (hasState && !hasYear) stateCard.innerHTML = `<h2>${stateFull} State Summary</h2>`;
      else if (!hasState && hasYear) stateCard.innerHTML = `<h2>State Summary (${yearNum})</h2>`;
      else stateCard.innerHTML = `<h2>State Summary</h2>`;
      out.appendChild(stateCard);

      if (hasState && hasYear) {
        const df_state_all = await loadCSV(URLS.data_by_state_letter(firstLetter));
        const df_state_name_year = df_state_all.filter(r =>
          String(r["name"]) === name &&
          String(r["State"]) === stateRaw &&
          parseInt(r["year"], 10) === yearNum
        );

        if (df_state_name_year.length === 0) {
          stateCard.appendChild(makeTextBlock(`No state data found for ${name} in ${stateRaw} in ${yearNum}.`));
        } else {
          const target_name_state_agg = groupSum(
            df_state_name_year,
            ["name", "year", "State", "overall_rank", "overall_percentage"],
            "frequency"
          );

          let overall_rank_state = null;
          const overall_rank_state_val = (target_name_state_agg.length > 0) ? target_name_state_agg[0]["overall_rank"] : null;
          if (overall_rank_state_val !== null && overall_rank_state_val !== undefined && String(overall_rank_state_val).trim() !== "" && String(overall_rank_state_val).toLowerCase() !== "nan") {
            const v = Number(overall_rank_state_val);
            if (Number.isFinite(v)) overall_rank_state = parseInt(v, 10);
          }

          const total_freq_state = target_name_state_agg.reduce((acc, r) => acc + (Number(r["frequency"]) || 0), 0) | 0;
          const male_freq_state = df_state_name_year
            .filter(r => String(r["sex"]) === "M")
            .reduce((acc, r) => acc + (Number(r["frequency"]) || 0), 0) | 0;
          const female_freq_state = df_state_name_year
            .filter(r => String(r["sex"]) === "F")
            .reduce((acc, r) => acc + (Number(r["frequency"]) || 0), 0) | 0;

          const rank_state_str = (overall_rank_state !== null) ? ordinal(overall_rank_state) : "N/A";

          const state_text =
            `There were ${total_freq_state.toLocaleString()} babies born in ${stateRaw} with the name ${name} in ${yearNum} ` +
            `(${male_freq_state.toLocaleString()} M, ${female_freq_state.toLocaleString()} F).\n` +
            `It was the ${rank_state_str} most popular name in ${stateRaw} that year.\n` +
            `See the tables below for more.`;

          stateCard.appendChild(makeTextBlock(state_text));

          const df_state_top_all = await loadCSV(URLS.top_names_state_yearly);
          const df_state_top_year_state = df_state_top_all.filter(r =>
            parseInt(r["year"], 10) === yearNum && String(r["State"]) === stateRaw
          );

          let state_table_data = df_state_top_year_state.filter(r => Number(r["overall_rank"]) <= 5);
          state_table_data = groupSum(
            state_table_data,
            ["name", "overall_rank", "overall_percentage"],
            "frequency"
          );
          state_table_data = sortByNumericField(state_table_data, "overall_rank", true);

          const target_row_state = target_name_state_agg.slice(0, 1).map(r => ({
            name: r["name"],
            frequency: r["frequency"],
            overall_rank: r["overall_rank"],
            overall_percentage: r["overall_percentage"]
          }));

          if (target_row_state.length) {
            const target_rank = Number(target_row_state[0].overall_rank);
            const inTop5 = state_table_data.some(r => toLowerTrim(r.name) === name.toLowerCase());

            if (Number.isFinite(target_rank) && target_rank > 5 && !inTop5) {
              const dots = { name: "...", frequency: "...", overall_rank: "...", overall_percentage: "..." };
              const insert_idx = state_table_data.filter(r => {
                const v = Number(r.overall_rank);
                return Number.isFinite(v) && v < target_rank;
              }).length;

              state_table_data = [
                ...state_table_data.slice(0, insert_idx),
                dots,
                ...target_row_state,
                ...state_table_data.slice(insert_idx)
              ];
            } else if (!inTop5 && Number.isFinite(target_rank) && target_rank <= 5) {
              state_table_data.push(target_row_state[0]);
              state_table_data = groupSum(
                state_table_data,
                ["name", "overall_rank", "overall_percentage"],
                "frequency"
              );
              state_table_data = sortByNumericField(state_table_data, "overall_rank", true);
            }
          }

          const st_rows = state_table_data.map(r => ({
            "State Rank": r.overall_rank,
            "Name": r.name,
            "Frequency": (r.frequency === "...") ? "..." : (Number(r.frequency) || 0).toLocaleString(),
            "Percentage": r.overall_percentage
          }));

          renderTable(
            stateCard,
            `${stateRaw} Popularity Table (${yearNum}):`,
            st_rows,
            ["State Rank", "Name", "Frequency", "Percentage"],
            { boldRowPredicate: (r) => String(r["Name"]).toLowerCase() === name.toLowerCase() }
          );
        }
      }

      // ============================================================
      // State over/underrepresentation (all-time)
      // ============================================================
      const state_representation_df_all = await loadCSV(URLS.state_representation);
      const state_representation_df = state_representation_df_all.filter(r => String(r["name"]) === name);

      if (state_representation_df.length === 0) {
        stateCard.appendChild(makeTextBlock(`No state representation data found for name '${name}'.`));
        return;
      }

      const rep_sorted = state_representation_df.slice().sort((a,b) => Number(b["state_percentage"]) - Number(a["state_percentage"]));
      rep_sorted.forEach((r, idx) => r["Rank"] = idx + 1);

      const top3 = rep_sorted.slice(0, 3);
      const bot3 = rep_sorted.slice(-3);
      const target_state_data = hasState ? rep_sorted.filter(r => String(r["State"]) === stateRaw) : [];

      const states_to_show = new Set([
        ...top3.map(r => r["State"]),
        ...bot3.map(r => r["State"])
      ]);
      if (target_state_data.length) states_to_show.add(stateRaw);

      const filtered = rep_sorted
        .filter(r => states_to_show.has(r["State"]))
        .sort((a,b) => Number(b["state_percentage"]) - Number(a["state_percentage"]));

      const final_rows = [];
      let last_idx = null;

      function origIndexForState(st) {
        return rep_sorted.findIndex(r => String(r["State"]) === String(st));
      }

      for (const row of filtered) {
        const orig_idx = origIndexForState(row["State"]);
        if (last_idx !== null && orig_idx > last_idx + 1) {
          final_rows.push({
            "Rank": "...",
            "State": "...",
            "Frequency": "...",
            "Percentage": "..."
          });
        }
        final_rows.push({
          "Rank": parseInt(row["Rank"], 10),
          "State": row["State"],
          "Frequency": (Number(row["frequency"]) || 0).toLocaleString(),
          "Percentage": Number(row["state_percentage"]).toFixed(5)
        });
        last_idx = orig_idx;
      }

      const top_state = rep_sorted[0];
      const bottom_state = rep_sorted[rep_sorted.length - 1];

      const rep_text =
        `The state where ${name} is most overrepresented (all time) is ${top_state["State"]} ` +
        `with ${Number(top_state["state_percentage"]).toFixed(5)}% of babies named ${name}.\n` +
        `It is most underrepresented in ${bottom_state["State"]} where only ` +
        `${Number(bottom_state["state_percentage"]).toFixed(5)}% of babies were named ${name}.\n` +
        `See the tables below for more.`;

      stateCard.appendChild(makeTextBlock(rep_text));

      renderTable(
        stateCard,
        `State Over/Underrepresentation for ${name} (All Time):`,
        final_rows,
        ["Rank", "State", "Frequency", "Percentage"],
        { boldRowPredicate: (r) => hasState && String(r["State"]).toUpperCase() === stateRaw }
      );

    } catch (err) {
      console.error(err);
      setError(`Error:\n${err?.message || String(err)}`);
    }
  }

  // ============================================================
  // Wire up hidden button (kept for compatibility with bridge)
  // ============================================================
  document.getElementById("runBtn").addEventListener("click", () => {
    const name = document.getElementById("nameInput").value;
    const state = document.getElementById("stateInput").value;
    const year = document.getElementById("yearInput").value;
    writeSummaryHTML(name, state, year);
  });
})();
</script>

<script>
  // Bridge: accept inputs from parent index.html and run.
  window.addEventListener("message", (event) => {
    const d = event.data || {};
    if (d.type !== "SET_INPUTS_AND_RUN") return;

    if (typeof d.name === "string") document.getElementById("nameInput").value = d.name;
    if (typeof d.state === "string") document.getElementById("stateInput").value = d.state;
    if (typeof d.year === "string") document.getElementById("yearInput").value = d.year;

    document.getElementById("runBtn").click();
  });
</script>

</body>
</html>
