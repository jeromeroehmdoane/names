<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Name Popularity – Line + Map</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: #fafafa;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 14px;
    }

    .panel {
      width: 100%;
      border: none;
      margin-bottom: 24px;
    }

    /* Adjust heights as needed */
    #line-frame {
      height: 700px;
    }

    #map-frame {
      height: 900px;
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- Line graph (top) -->
    <iframe
      id="line-frame"
      class="panel"
      src="line.html"
      title="Name Popularity Over Time">
    </iframe>

    <!-- Map (bottom) -->
    <iframe
      id="map-frame"
      class="panel"
      src="map.html"
      title="Name Popularity by State">
    </iframe>
  </div>
</body>
</html>
